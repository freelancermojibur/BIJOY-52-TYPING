<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>বিজয় শিখি — বিজয় ৫২ টাইপিং শেখার প্ল্যাটফর্ম by Morjina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e211b;
  --bg2:#132a22;
  --bg3:#183327;
  --paper:#f4efdd;
  --paper2:#eae3cb;
  --ink:#18231d;
  --text:#ece7d6;
  --text-dim:#b9c2b7;
  --gold:#e3b23c;
  --gold-dim:#a5822e;
  --red:#e2544b;
  --red-dim:#a53f3a;
  --green:#3fa772;
  --line:rgba(236,231,214,0.14);
  --shadow:0 12px 30px rgba(0,0,0,0.35);
  --radius:14px;
  --f0:#c9503f;--f1:#d68a3c;--f2:#c7a93d;--f3:#7ea23c;
  --f4:#3e9b6e;--f5:#3e96a8;--f6:#4c79c4;--f7:#8064c9;--f8:#8d8d8d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 700px at 15% -10%, #163a2c 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Tiro Bangla','Hind Siliguri',serif;font-weight:400;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold);color:var(--ink);}

/* ---------- layout shell ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 4px 14px;position:sticky;top:0;z-index:40;
  background:linear-gradient(var(--bg) 78%, transparent);
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand .mark{
  width:42px;height:42px;border-radius:12px;background:linear-gradient(155deg,var(--gold),#b9862c);
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:'Tiro Bangla',serif;
  font-size:22px;font-weight:400;box-shadow:var(--shadow);flex-shrink:0;
}
.brand .name{font-family:'Tiro Bangla',serif;font-size:22px;letter-spacing:0.5px;}
.brand .name small{display:block;font-family:'Hind Siliguri';font-size:11.5px;color:var(--text-dim);font-weight:500;letter-spacing:1.5px;}
nav.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;}
nav.tabs button{
  border:none;background:transparent;color:var(--text-dim);padding:9px 16px;border-radius:999px;
  font-size:14.5px;font-weight:600;transition:.18s;white-space:nowrap;
}
nav.tabs button.active{background:var(--gold);color:var(--ink);}
nav.tabs button:not(.active):hover{color:var(--text);}
.iconbtn{border:1px solid var(--line);background:var(--bg2);color:var(--text-dim);width:38px;height:38px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;}
.iconbtn.on{color:var(--gold);border-color:var(--gold-dim);}
.topbar-right{display:flex;gap:8px;align-items:center;}
@media(max-width:760px){
  .brand .name{font-size:18px}
  nav.tabs{position:fixed;bottom:10px;left:12px;right:12px;justify-content:space-between;box-shadow:var(--shadow);z-index:50;}
  nav.tabs button{flex:1;padding:10px 6px;font-size:12.5px;}
  #app{padding-bottom:90px;}
}

/* ---------- generic ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.card.paper{background:var(--paper);color:var(--ink);border:none;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--text-dim);font-weight:600;}
.btn{
  border:none;border-radius:11px;padding:13px 22px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;transition:.15s;
}
.btn-primary{background:var(--gold);color:var(--ink);}
.btn-primary:hover{background:#eec25a;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-ghost:hover{border-color:var(--gold-dim);}
.btn-red{background:var(--red);color:#2a0e0c;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.grid{display:grid;gap:18px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:760px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}
.muted{color:var(--text-dim);}
.section-title{font-size:26px;margin:8px 0 6px;}
.section-sub{color:var(--text-dim);font-size:15px;margin-bottom:24px;max-width:640px;line-height:1.6;}

/* ---------- HOME ---------- */
.hero{padding:52px 4px 30px;}
.hero .eyebrow{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.5px;margin-bottom:14px;}
.hero h1{font-size:44px;line-height:1.25;margin:0 0 18px;max-width:760px;}
.hero p{font-size:17px;color:var(--text-dim);max-width:600px;line-height:1.75;margin-bottom:30px;}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;}
@media(max-width:600px){.hero h1{font-size:30px}}
.feature{padding:20px;}
.feature .num{color:var(--gold);font-family:'Tiro Bangla',serif;font-size:26px;margin-bottom:10px;display:block;}
.feature h3{font-size:18px;margin:0 0 8px;}
.feature p{color:var(--text-dim);font-size:14.5px;line-height:1.65;margin:0;}
.stripbox{display:flex;gap:26px;flex-wrap:wrap;padding:26px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:30px 0;}
.stripbox .stat b{display:block;font-family:'Tiro Bangla',serif;font-size:30px;color:var(--gold);}
.stripbox .stat span{color:var(--text-dim);font-size:13px;}

/* ---------- LESSON LIST ---------- */
.lesson-row{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--bg2);margin-bottom:12px;cursor:pointer;transition:.15s;
}
.lesson-row:hover{border-color:var(--gold-dim);}
.lesson-row.locked{opacity:.45;cursor:not-allowed;}
.lesson-num{width:44px;height:44px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:'Tiro Bangla',serif;font-size:19px;flex-shrink:0;}
.lesson-row.done .lesson-num{background:var(--green);color:#062;}
.lesson-body{flex:1;min-width:0;}
.lesson-body h3{margin:0 0 4px;font-size:17px;}
.lesson-body p{margin:0;color:var(--text-dim);font-size:13.5px;}
.lesson-keys{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.keychip{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;}
.lesson-wpm{text-align:right;font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
.lesson-wpm b{display:block;color:var(--gold);font-size:19px;}

/* ---------- TYPING / PRACTICE ---------- */
.practice-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.statbar{display:flex;gap:10px;flex-wrap:wrap;}
.statchip{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:8px 16px;min-width:78px;text-align:center;}
.statchip b{display:block;font-size:20px;font-family:'Tiro Bangla',serif;color:var(--gold);}
.statchip span{font-size:11px;color:var(--text-dim);}
.energywrap{margin:6px 0 20px;}
.energybar{height:10px;border-radius:999px;background:var(--bg3);overflow:hidden;border:1px solid var(--line);}
.energyfill{height:100%;background:linear-gradient(90deg,var(--gold),#f1cf7c);transition:width .25s;}
.progressfill{height:100%;background:linear-gradient(90deg,var(--f4),var(--f5));transition:width .25s;}
.energylabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-top:5px;}

.typebox{
  background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:34px 30px;
  font-size:30px;line-height:2.1;letter-spacing:1px;min-height:150px;box-shadow:var(--shadow);
  word-break:break-word;
}
.tk{position:relative;display:inline-block;padding:0 1px;border-bottom:3px solid rgba(0,0,0,0.15);margin:0 1px;}
.tk.pending{color:#3b342055;border-color:rgba(0,0,0,0.15);}
.tk.correct{color:#1c5e3e;border-color:var(--green);}
.tk.wrong{color:var(--red);border-color:var(--red);background:rgba(226,84,75,0.12);border-radius:4px;}
.tk.space{border-color:transparent;width:14px;}
.tk.current{background:rgba(227,178,60,0.28);border-radius:4px;border-color:var(--gold-dim);}
.tk.current::after{content:'';position:absolute;left:0;bottom:-3px;width:100%;height:3px;background:var(--gold);animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0.15}}

.nextkey-hint{
  display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin:16px 0;font-size:14.5px;
}
.nextkey-hint .badge{
  min-width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,0.3);
}
.nextkey-hint .arrow{color:var(--text-dim);}
.nextkey-hint .bnchar{font-family:'Tiro Bangla',serif;font-size:22px;color:var(--gold);}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--red);color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* ---------- KEYBOARD ---------- */
.kbwrap{margin-top:22px;}
.kbtoolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.kbtoolbar .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);}
.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
.kb{background:#0a1815;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
.kbrow{display:flex;gap:6px;margin-bottom:6px;}
.kbrow:last-child{margin-bottom:0;}
.key{
  flex:1;background:var(--bg2);border:1px solid rgba(236,231,214,0.08);border-bottom:3px solid rgba(0,0,0,0.4);
  border-radius:8px;min-height:52px;position:relative;display:flex;align-items:flex-end;justify-content:flex-start;
  padding:4px 6px;transition:.1s;user-select:none;
}
.key.ctrl{background:#0e1c17;color:var(--text-dim);font-size:10.5px;align-items:center;justify-content:center;font-weight:600;}
.key .base{font-family:'Tiro Bangla',serif;font-size:16px;line-height:1;color:var(--text);}
.key .base.en{font-family:'Hind Siliguri';font-size:12px;color:var(--text-dim);}
.key .shift{position:absolute;top:4px;right:6px;font-size:12px;color:var(--gold);font-family:'Tiro Bangla',serif;}
.key .altgr{position:absolute;top:4px;left:6px;font-size:10.5px;color:#7fd7c4;font-family:'Tiro Bangla',serif;}
.key.active{transform:translateY(1px);box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(227,178,60,0.55);border-bottom-width:1px;}
.key.mod-active{box-shadow:0 0 0 2px var(--text);}
.key.w-space{flex:6;}
.key.w-tab,.key.w-caps,.key.w-bslash{flex:1.5;}
.key.w-enter{flex:2;}
.key.w-shift{flex:2.3;}
.key.w-bksp{flex:1.7;}
.key.w-sm{flex:0.9;}
.fingertip{position:absolute;left:6px;bottom:4px;width:6px;height:6px;border-radius:50%;}
.kb button{width:100%;height:100%;background:none;border:none;color:inherit;text-align:left;padding:0;}

.togglebtn{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--text-dim);}
.togglebtn.on{color:var(--gold);border-color:var(--gold-dim);}

/* ---------- lesson info / results ---------- */
.newkeys-strip{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px;}
.nk-card{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px;text-align:center;}
.nk-card .en{font-weight:800;font-size:13px;color:var(--text-dim);}
.nk-card .arrowbn{font-family:'Tiro Bangla',serif;font-size:22px;margin:4px 0;color:var(--gold);}
.nk-card .fname{font-size:10.5px;color:var(--text-dim);}
.wordlist-preview{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.wl-chip{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-family:'Tiro Bangla',serif;font-size:16px;}
.wl-chip small{display:block;font-family:'Hind Siliguri';font-size:10.5px;color:var(--text-dim);}

.resultcard{text-align:center;padding:40px 20px;}
.resultcard .big{font-family:'Tiro Bangla',serif;font-size:56px;color:var(--gold);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0;}
@media(max-width:600px){.result-grid{grid-template-columns:repeat(2,1fr);}}
.result-grid .rc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 8px;}
.result-grid .rc b{display:block;font-size:22px;color:var(--gold);font-family:'Tiro Bangla',serif;}
.result-grid .rc span{font-size:11.5px;color:var(--text-dim);}
.mistake-row{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 15px;margin-bottom:8px;text-align:left;}
.mistake-row .badge{min-width:30px;height:30px;border-radius:7px;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;}
.mistake-row .txt{flex:1;font-size:13.5px;}
.mistake-row .txt b{color:var(--gold);}
.mistake-row .cnt{font-size:12px;color:var(--text-dim);}

/* ---------- stats ---------- */
.histrow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;font-size:13.5px;}
.histrow .l{color:var(--text-dim);}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.barrow .lbl{width:110px;flex-shrink:0;font-size:13px;}
.barrow .track{flex:1;height:10px;background:var(--bg3);border-radius:999px;overflow:hidden;}
.barrow .fill{height:100%;background:var(--red);}
.barrow .n{width:34px;text-align:right;font-size:12px;color:var(--text-dim);}

/* ---------- chart screen ---------- */
.chart-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.chart-table th,.chart-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;}
.chart-table th{color:var(--text-dim);font-weight:600;font-size:12px;}
.chart-table td.bn{font-family:'Tiro Bangla',serif;font-size:17px;color:var(--gold);}
.chart-table td.k{font-weight:800;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;padding:4px 14px;background:var(--bg2);margin-bottom:20px;}

footer.pagefoot{text-align:center;color:var(--text-dim);font-size:12.5px;padding:40px 0 10px;}
</style>
</head>

<script>
/* =========================================================================
   ১) বিজয় ৫২ কী-ম্যাপ ইঞ্জিন (verified against official Bijoy 52 layout)

const KEYMAP = {
  '`':{base:'',shift:'',altgr:''},

  'j':{base:'ক',shift:'খ',altgr:''}, 'k':{base:'ত',shift:'থ',altgr:''},

  'b':{base:'ন',shift:'ণ',altgr:''}, 'n':{base:'স',shift:'ষ',altgr:''},

  '.':{base:'.',shift:'>',altgr:'়'}, '/':{base:'/',shift:'?',altgr:''},
};
const CODE_TO_KEY = {
  Backquote:'`',Digit1:'1',Digit2:'2',Digit3:'3',Digit4:'4',Digit5:'5',Digit6:'6',Digit7:'7',Digit8:'8',Digit9:'9',Digit0:'0',
  Minus:'-',Equal:'=',KeyQ:'q',KeyW:'w',KeyE:'e',KeyR:'r',KeyT:'t',KeyY:'y',KeyU:'u',KeyI:'i',KeyO:'o',KeyP:'p',
  BracketLeft:'[',BracketRight:']',Backslash:'\\',KeyA:'a',KeyS:'s',KeyD:'d',KeyF:'f',KeyG:'g',KeyH:'h',KeyJ:'j',
  KeyK:'k',KeyL:'l',Semicolon:';',Quote:"'",KeyZ:'z',KeyX:'x',KeyC:'c',KeyV:'v',KeyB:'b',KeyN:'n',KeyM:'m',
  Comma:',',Period:'.',Slash:'/',Space:' '
};
const FINGER = {
  '`':0,'1':0,'q':0,'a':0,'z':0,
  '2':1,'w':1,'s':1,'x':1,
  '3':2,'e':2,'d':2,'c':2,
  '4':3,'5':3,'r':3,'f':3,'v':3,'t':3,'g':3,'b':3,
  '6':4,'7':4,'y':4,'h':4,'u':4,'n':4,'j':4,'m':4,
  '8':5,'i':5,'k':5,',':5,
  '9':6,'o':6,'l':6,'.':6,
  '0':7,'-':7,'=':7,'p':7,'[':7,']':7,'\\':7,';':7,"'":7,'/':7,
  ' ':8
};
const FINGER_COLOR = ['var(--f0)','var(--f1)','var(--f2)','var(--f3)','var(--f4)','var(--f5)','var(--f6)','var(--f7)','var(--f8)'];
const FINGER_NAME = ['বাম কনিষ্ঠা','বাম অনামিকা','বাম মধ্যমা','বাম তর্জনী','ডান তর্জনী','ডান মধ্যমা','ডান অনামিকা','ডান কনিষ্ঠা','বৃদ্ধাঙ্গুলি'];

const KEY_ROWS = [

  [['Shift',2.3],['z',1],['x',1],['c',1],['v',1],['b',1],['n',1],['m',1],[',',1],['.',1],['/',1],['Shift',2.3]],

const CTRL_LABEL = {Backspace:'⌫ Bksp',Tab:'Tab ⇥',CapsLock:'Caps Lock',Enter:'⏎ Enter',Shift:'⇧ Shift',Ctrl:'Ctrl',Win:'⊞',Alt:'Alt',AltGr:'AltGr',Menu:'☰'};

function parseCode(code){
  // lowercase = base key, UPPERCASE = shift, '@'+lower = altgr, ' ' = literal space
  const tokens=[]; let i=0;
  while(i<code.length){
    const ch=code[i];
    if(ch==='@'){ tokens.push({key:code[i+1].toLowerCase(),layer:'altgr'}); i+=2; continue; }
    if(ch===' '){ tokens.push({key:' ',layer:'space'}); i++; continue; }
    if(ch>='A'&&ch<='Z'){ tokens.push({key:ch.toLowerCase(),layer:'shift'}); i++; continue; }
    tokens.push({key:ch,layer:'base'}); i++;
  }
  return tokens;
}
function tokenChar(t){ return t.layer==='space' ? ' ' : (KEYMAP[t.key] ? KEYMAP[t.key][t.layer] : ''); }
function buildChars(tokens){ return tokens.map(t=>({key:t.key,layer:t.layer,char:tokenChar(t),state:'pending'})); }

/* =========================================================================
   ৩) TypingSession — মূল টাইপিং ইঞ্জিন
   ========================================================================= */
class TypingSession{
  constructor(items, opts){
    // items: array of {tokens, gloss}
    this.items = items;
    this.chars = []; this.itemBounds = [];
    items.forEach((it,idx)=>{
      if(idx>0){ this.chars.push({key:' ',layer:'space',char:' ',state:'pending', wordBreak:true}); }
      const start=this.chars.length;
      buildChars(it.tokens).forEach(c=>this.chars.push(c));
      this.itemBounds.push([start,this.chars.length]);
    });
    this.pos=0; this.startTime=null; this.endTime=null;
    this.correct=0; this.wrong=0; this.combo=0; this.maxCombo=0;
    this.mistakes={}; // key -> count
    this.mistakeDetail={}; // key -> {expectedLayer,typed}
    this.onUpdate = opts.onUpdate || function(){};
    this.onComplete = opts.onComplete || function(){};
    this.onMistake = opts.onMistake || function(){};
  }
  currentToken(){ return this.pos < this.chars.length ? this.chars[this.pos] : null; }
  progress(){ return this.chars.length ? this.pos/this.chars.length : 0; }
  elapsedMin(){ if(!this.startTime) return 0; const end=this.endTime||Date.now(); return (end-this.startTime)/60000; }
  wpm(){ const m=this.elapsedMin(); if(!m) return 0; return Math.round((this.correct/5)/m) || 0; }
  accuracy(){ const t=this.correct+this.wrong; return t? Math.round(this.correct/t*100):100; }
  backspace(){
    if(this.pos<=0) return;
    this.pos--;
    const c=this.chars[this.pos];
    if(c.state==='correct') this.correct--; else if(c.state==='wrong') this.wrong--;
    c.state='pending';
    this.onUpdate();
  }
  input(keyId, layerWanted){
    if(!this.startTime) this.startTime=Date.now();
    const cur=this.currentToken();
    if(!cur) return;
    let typedChar;
    if(keyId===' '){ typedChar=' '; }
    else{ const km=KEYMAP[keyId]; typedChar = km ? km[layerWanted] : undefined; }
    if(typedChar===undefined) return;
    const expected=cur.char;
    if(typedChar===expected){
      cur.state='correct'; this.correct++; this.combo++; this.maxCombo=Math.max(this.maxCombo,this.combo);
    }else{
      cur.state='wrong'; this.wrong++; this.combo=0;
      const mk=cur.key==='  '?'?':cur.key;
      this.mistakes[cur.key]=(this.mistakes[cur.key]||0)+1;
      this.mistakeDetail[cur.key]={expectedLayer:cur.layer,typedKey:keyId,typedLayer:layerWanted};
      this.onMistake(cur,keyId,layerWanted);
    }
    this.pos++;
    if(this.pos>=this.chars.length){ this.endTime=Date.now(); this.onUpdate(); this.onComplete(this.summary()); return; }
    this.onUpdate();
  }
  summary(){
    return { wpm:this.wpm(), accuracy:this.accuracy(), correct:this.correct, wrong:this.wrong,
      maxCombo:this.maxCombo, timeSec:Math.round((this.endTime-this.startTime)/1000)||0, mistakes:this.mistakes };
  }
}

   ========================================================================= */
let actx=null;
function beep(freq,dur,type){
  if(!DB.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=0.05; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}
function sndCorrect(){ beep(720,0.07,'sine'); }
function sndWrong(){ beep(160,0.14,'sawtooth'); }
function sndDone(){ beep(500,0.1,'sine'); setTimeout(()=>beep(700,0.16,'sine'),90); }

function renderKeyboard(expected, opts){
  opts=opts||{};
  const showAltgr = opts.showAltgr;
  let html = '<div class="kb" id="virtualKb">';
  KEY_ROWS.forEach(row=>{
    html += '<div class="kbrow">';
    row.forEach(([id,w])=>{
      const isTyping = KEYMAP[id]!==undefined || id===' ';
      let cls='key';
      if(!isTyping){
        cls+=' ctrl';
        if(id==='Backspace') cls+=' w-bksp';
        else if(id==='Tab'||id==='CapsLock'||id==='\\') cls+=' w-tab';
        else if(id==='Enter') cls+=' w-enter';
        else if(id==='Shift') cls+=' w-shift';
        else cls+=' w-sm';
        let active = false;
        if(expected){
          if(id==='Shift' && expected.layer==='shift') active=true;
          if(id==='AltGr' && expected.layer==='altgr') active=true;
        }
        if(active) cls+=' mod-active';
        html += `<div class="${cls}" style="flex:${w}"><button data-ctrl="${id}">${CTRL_LABEL[id]||id}</button></div>`;
        return;
      }
      if(id===' '){
        cls+=' w-space';
        let active = expected && expected.key===' ';
        if(active) cls+=' active';
        html += `<div class="${cls}" style="flex:${w}"><button data-key=" " style="width:100%;height:100%;">স্পেস</button></div>`;
        return;
      }
      const km = KEYMAP[id];
      const fi = FINGER[id];
      let active = expected && expected.key===id;
      if(active) cls+=' active';
      const bn = km.base || '';
      const sh = km.shift || '';
      const ag = km.altgr || '';
      html += `<div class="${cls}" style="flex:${w}">
        <div class="fingertip" style="background:${FINGER_COLOR[fi]}"></div>
        ${sh?`<div class="shift">${sh}</div>`:''}
        ${(showAltgr && ag)?`<div class="altgr">${ag}</div>`:''}
        <button data-key="${id}">
          <span class="base">${bn||id.toUpperCase()}</span>
        </button>
      </div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

let activeKeyHandler = null;
function attachPhysicalKeyboard(session, onAny){
  if(activeKeyHandler) document.removeEventListener('keydown', activeKeyHandler);
  activeKeyHandler = function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const isAltGr = (e.getModifierState && e.getModifierState('AltGraph')) || (e.ctrlKey && e.altKey);
    if((e.ctrlKey||e.metaKey) && !isAltGr) return; // let real browser shortcuts through
    if(e.key==='Backspace'){ e.preventDefault(); session.backspace(); onAny(); return; }
    if(e.code==='Tab' || e.code==='Escape') return;
    const keyId = CODE_TO_KEY[e.code];
    if(keyId===undefined) return;
    e.preventDefault();
    let layer='base';
    if(keyId===' ') layer='space';
    else if(isAltGr) layer='altgr';
    else if(e.shiftKey) layer='shift';
    const before = session.pos;
    session.input(keyId, layer);
    if(session.pos>before){
      const st = session.chars[before].state;
      if(st==='correct') sndCorrect(); else sndWrong();
    }
    onAny();
  };
  document.addEventListener('keydown', activeKeyHandler);
}
function detachPhysicalKeyboard(){ if(activeKeyHandler){ document.removeEventListener('keydown', activeKeyHandler); activeKeyHandler=null; } }
function handleVirtualKey(keyId){
  const session = state.session; if(!session) return;
  let layer = state.vAltgr ? 'altgr' : (state.vShift ? 'shift' : 'base');
  if(keyId===' ') layer='space';
  const before=session.pos;
  session.input(keyId, layer);
  state.vShift=false; state.vAltgr=false;
  if(session.pos>before){ const st=session.chars[before].state; if(st==='correct') sndCorrect(); else sndWrong(); }
  refreshTypingUI();
}

function showMistakeToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showMistakeToast._t);
  showMistakeToast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function mistakeMsg(cur, typedKey, typedLayer){
  const wantMod = cur.layer==='shift'?'Shift+':(cur.layer==='altgr'?'AltGr+':'');
  return `ভুল হলো — দরকার ছিল ${wantMod}${cur.key.toUpperCase()} (${cur.char})`;
}

function refreshTypingUI(){
  const session = state.session; if(!session) return;
  const sb=document.getElementById('statbarWrap'); if(sb) sb.innerHTML = statBarHTML(session);
  const tb=document.getElementById('typebox'); if(tb) tb.innerHTML = renderTypebox(session);
  const nk=document.getElementById('nextHint'); if(nk) nk.innerHTML = nextKeyHint(session);
  const pf=document.getElementById('progFill'); if(pf) pf.style.width = Math.round(session.progress()*100)+'%';
  const ef=document.getElementById('energyFill'); if(ef) ef.style.width = Math.max(6,100-session.wrong*100/Math.max(6,session.correct+session.wrong))+'%';
  const kbHolder=document.getElementById('kbHolder');
  if(kbHolder){
    kbHolder.innerHTML = renderKeyboard(session.currentToken(), {showAltgr: state.showAltgr});
    bindKeyboardClicks(kbHolder, handleVirtualKey);
  }
}

function pickGameWords(n){
  const all=[];
  LESSONS.forEach(l=> l.words.forEach(w=>all.push(w)) );
  const picked=[];
  const pool=[...all];
  for(let i=0;i<n && pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0]);
  }
  return picked.map(([code,gloss])=>({tokens:parseCode(code), gloss}));
}

  function row(label, keys){
    return keys.map(k=>{
      const km=KEYMAP[k];
      return `<tr><td class="k">${k.toUpperCase()}</td><td class="bn">${km.base||'—'}</td><td class="bn">${km.shift||'—'}</td><td class="bn">${km.altgr||'—'}</td></tr>`;
    }).join('');
  }
  return `
  <h2 class="section-title">সম্পূর্ণ বিজয় ৫২ চার্ট</h2>
  <p class="section-sub">রেফারেন্সের জন্য পুরো কী-ম্যাপ। Base = শিফট ছাড়া, Shift = শিফট চেপে, AltGr = ডান-Alt চেপে (স্বাধীন স্বরবর্ণ ও বিশেষ চিহ্নের জন্য)।</p>
  <div class="tablewrap"><table class="chart-table">
    <thead><tr><th>কী</th><th>Base</th><th>Shift</th><th>AltGr</th></tr></thead>
    <tbody>
      ${row('num',['1','2','3','4','5','6','7','8','9','0','-','='])}
      ${row('top',['q','w','e','r','t','y','u','i','o','p','[',']','\\'])}
      ${row('home',['a','s','d','f','g','h','j','k','l',';',"'"])}
      ${row('bottom',['z','x','c','v','b','n','m',',','.','/'])}
    </tbody>
  </table></div>
  <div class="kbwrap"><div id="kbHolderChart"></div></div>
  `;
}

/* =========================================================================
   ১০) MAIN RENDER
   ========================================================================= */
function navHTML(){
  const tabs=[['home','হোম'],['lessons','শিখুন'],['game','অনুশীলন'],['stats','পরিসংখ্যান'],['chart','চার্ট']];
  return tabs.map(([id,label])=>`<button class="${state.screen===id?'active':''}" data-go="${id}">${label}</button>`).join('');
}
function topbarHTML(){
  return `
  <div class="topbar">
    <div class="brand" data-go="home"><div class="mark">বি</div><div class="name">বিজয় শিখি<small>BIJOY 52 TYPING</small></div></div>
    <nav class="tabs">${navHTML()}</nav>
    <div class="topbar-right">
      <button class="iconbtn ${DB.sound?'on':''}" id="soundToggle" title="সাউন্ড">${DB.sound?'🔊':'🔇'}</button>
    </div>
  </div>`;
}

function render(){
  detachPhysicalKeyboard();
  let body='';
  if(state.screen==='home') body=screenHome();
  else if(state.screen==='lessons') body=screenLessons();
  else if(state.screen==='lessonIntro') body=screenLessonIntro(state.lessonIdx);
  else if(state.screen==='lessonPractice') body=screenTypingShell(LESSONS[state.lessonIdx].title, 'শব্দ অনুশীলন', 'lessonIntro');
  else if(state.screen==='lessonResult') body=screenResults('lesson', state.lastSummary, LESSONS[state.lessonIdx].title, 'পরের পাঠে যাই →');
  else if(state.screen==='game') body=screenGameIntro();
  else if(state.screen==='gamePlay') body=screenTypingShell('টাইপিং ফাইট — রাউন্ড চলছে', '২০টি শব্দ, যত দ্রুত ও নিভুর্লভাবে সম্ভব', 'game');
  else if(state.screen==='gameResult') body=screenResults('game', state.lastSummary, 'রাউন্ড ফলাফল', 'নতুন রাউন্ড →');
  else if(state.screen==='stats') body=screenStats();
  else if(state.screen==='chart') body=screenChart();

  document.getElementById('app').innerHTML = topbarHTML() + `<div class="content">${body}</div>` +
    `<footer class="pagefoot">বিজয় শিখি — মৌলিক থেকে দক্ষতা পর্যন্ত, ধাপে ধাপে বাংলা টাইপিং।</footer>`;

  bindGlobalNav();

  if(state.screen==='lessonIntro'){
    document.querySelectorAll('[data-start-lesson]').forEach(b=>b.addEventListener('click', e=>{
      startLessonPractice(parseInt(e.target.getAttribute('data-start-lesson')));
    }));
  }
  if(state.screen==='game'){
    document.querySelectorAll('[data-start-game]').forEach(b=>b.addEventListener('click', ()=> startGameRound() ));
  }
  if(state.screen==='lessonPractice' || state.screen==='gamePlay'){
    setupTypingScreen();
  }
  if(state.screen==='lessonResult'){
    document.getElementById('resultNext').addEventListener('click', ()=>{
      const nextIdx = state.lessonIdx+1;
      if(nextIdx < LESSONS.length) go('lessonIntro',{lessonIdx:nextIdx});
      else go('lessons');
    });
  }
  if(state.screen==='gameResult'){
    document.getElementById('resultNext').addEventListener('click', ()=> startGameRound() );
  }
  if(state.screen==='chart'){
    document.getElementById('kbHolderChart').innerHTML = renderKeyboard(null,{showAltgr:true});
  }
  if(state.screen==='lessons'){
    document.querySelectorAll('[data-lesson]').forEach(row=>{
      row.addEventListener('click', e=>{
        const idx = parseInt(row.getAttribute('data-lesson'));
        go('lessonIntro',{lessonIdx:idx});
      });
    });
  }
}
function bindGlobalNav(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=> go(el.getAttribute('data-go')) );
  });
  const st=document.getElementById('soundToggle');
  if(st) st.addEventListener('click', ()=>{ DB.sound=!DB.sound; saveDB(DB); render(); });
}

function startLessonPractice(idx){
  const l = LESSONS[idx];
  const items = buildLessonItems(l);
  state.lessonIdx = idx;
  state.session = new TypingSession(items, {
    onUpdate: refreshTypingUI,
    onMistake: (cur,k,layer)=> showMistakeToast(mistakeMsg(cur,k,layer)),
    onComplete: (summary)=>{
      sndDone();
      markLessonDone(l.id, summary.wpm);
      recordSession('lesson', l.title, summary);
      state.lastSummary = summary;
      setTimeout(()=> go('lessonResult'), 400);
    }
  });
  go('lessonPractice');
}
function startGameRound(){
  const items = pickGameWords(20);
  state.session = new TypingSession(items, {
    onUpdate: refreshTypingUI,
    onMistake: (cur,k,layer)=> showMistakeToast(mistakeMsg(cur,k,layer)),
    onComplete: (summary)=>{
      sndDone();
      recordSession('game', 'টাইপিং ফাইট রাউন্ড', summary);
      state.lastSummary = summary;
      setTimeout(()=> go('gameResult'), 400);
    }
  });
  go('gamePlay');
}
function setupTypingScreen(){
  const session = state.session;
  refreshTypingUI();
  attachPhysicalKeyboard(session, refreshTypingUI);
  const at=document.getElementById('altgrToggle');
  if(at) at.addEventListener('click', ()=>{ state.showAltgr=!state.showAltgr; refreshTypingUI(); at.textContent='AltGr চার্ট '+(state.showAltgr?'লুকান':'দেখান'); });
}

/* boot */
render();
</script>
</body>
</html>
